<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="PageSiren: stop pressing refresh. Get a siren the moment a page changes.">
  <title>PageSiren: stop pressing refresh. Get a siren the moment a page changes.</title>
  <style>
    .t { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; text-anchor: middle; }
    .halka { fill: none; stroke: #ff3a46; stroke-width: 3; transform-box: fill-box; transform-origin: center; animation: yayil 2.4s ease-out infinite; opacity: 0; }
    .h2 { animation-delay: .8s; }
    .h3 { animation-delay: 1.6s; }
    .parilti { transform-box: fill-box; transform-origin: center; animation: nefes 1.2s ease-in-out infinite; }
    .kubbe { animation: kubbe 1.2s ease-in-out infinite; }
    .d1 { animation: dalga 1.2s ease-in-out infinite; }
    .d2 { animation: dalga 1.2s ease-in-out .2s infinite; }
    @keyframes yayil { 0% { transform: scale(.35); opacity: .75; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes nefes { 0%, 100% { opacity: .45; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.08); } }
    @keyframes kubbe { 0%, 100% { fill: #e2252f; } 50% { fill: #ff4b55; } }
    @keyframes dalga { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .halka, .parilti, .kubbe, .d1, .d2 { animation: none; } .halka { opacity: .18; } }
  </style>
  <defs>
    <linearGradient id="zemin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f27"/>
      <stop offset="1" stop-color="#0e1014"/>
    </linearGradient>
    <radialGradient id="isik">
      <stop offset="0" stop-color="#ff2d3a" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ff2d3a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="kirp"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#kirp)">
    <rect width="1200" height="380" fill="url(#zemin)"/>
    <circle class="parilti" cx="600" cy="100" r="230" fill="url(#isik)"/>
    <circle class="halka" cx="600" cy="100" r="110"/>
    <circle class="halka h2" cx="600" cy="100" r="110"/>
    <circle class="halka h3" cx="600" cy="100" r="110"/>
    <g transform="translate(536 28) scale(1)">
      <g fill="none" stroke="#ffc440" stroke-width="5">
        <path class="d1" d="M73.7 22.8a40 40 0 0 1 24.6 18.3"/>
        <path class="d2" d="M76.2 13.5a50 50 0 0 1 30.8 22.9"/>
        <path class="d1" d="M29.7 41.1a40 40 0 0 1 24.6-18.3"/>
        <path class="d2" d="M21 36.4a50 50 0 0 1 30.8-22.9"/>
      </g>
      <path class="kubbe" d="M34 62a30 30 0 0 1 60 0v17a3 3 0 0 1-3 3H37a3 3 0 0 1-3-3z" fill="#e2252f"/>
      <circle cx="54" cy="52" r="8" fill="#ff9696"/>
      <rect x="26" y="84" width="76" height="14" rx="5" fill="#ebeef3"/>
    </g>
    <text class="t" x="600" y="222" font-size="84" font-weight="700" fill="#ffffff">PageSiren</text>
    <text class="t" x="600" y="284" font-size="34" fill="#d5d9e2">Stop pressing refresh. Get a <tspan fill="#ff6a72" font-weight="700">siren</tspan> the moment a page changes.</text>
    <text class="t" x="600" y="334" font-size="22" fill="#8d94a3">Free  ·  Runs on your computer  ·  No account  ·  No cloud</text>
  </g>
</svg>

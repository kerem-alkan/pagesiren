name: publish to npm
# Runs when a version tag is pushed, or by hand. No token is stored anywhere: npm trusts this workflow file through
# trusted publishing (package settings on npmjs.com: GitHub Actions, this repository, npm-publish.yml).
# It needs npm 11.5.1 or newer, which Node 24 ships with, and it adds the provenance signature by itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm run test:core
      - run: npm publish

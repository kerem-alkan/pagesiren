name: publish to npm
# Runs when a version tag is pushed, or by hand. No token is stored anywhere: npm trusts this workflow file through
# trusted publishing (package settings on npmjs.com: GitHub Actions, this repository, npm-publish.yml).
# It needs npm 11.5.1 or newer, which Node 24 ships with, and it adds the provenance signature by itself.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm run test:core
      - name: Wait until this commit's tests have passed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # A version tag can be pushed right away: nothing is published before the tests of the same commit have passed.
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 120); do
            r=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] | .status + " " + .conclusion' 2>/dev/null || true)
            case "$r" in
              "completed success") echo "The tests of $sha passed."; exit 0;;
              completed*) echo "The tests of $sha did not pass ($r): nothing is published."; exit 1;;
            esac
            echo "Waiting for the tests of $sha (${r:-not started})"
            sleep 20
          done
          echo "The tests of $sha did not finish within 40 minutes."
          exit 1
      - name: Publish
        # A version that is already on npm is not an error (the workflow was started twice). A passing server error gets two more tries.
        run: |
          v=$(node -p "require('./package.json').version")
          for deneme in 1 2 3; do
            if [ "$(npm view "pagesiren@$v" version 2>/dev/null)" = "$v" ]; then echo "pagesiren@$v is on npm"; exit 0; fi
            npm publish && exit 0
            echo "npm did not take it (try $deneme), trying again in 30 s"
            sleep 30
          done
          exit 1

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again
        required: true
permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: The bundled runtime must be the official signed Node.js
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature (Get-Command node).Source
          if ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notmatch 'OpenJS') { throw "unexpected signature: $($s.Status) $($s.SignerCertificate.Subject)" }
      - run: node tools/build-windows.js
      - run: node test/installer.test.js dist/PageSiren-Setup.exe
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/PageSiren-Setup.exe
      - name: Wait until this commit's tests have passed
        shell: bash
        # A version tag can be pushed right away: nothing is published before the tests of the same commit have passed.
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 120); do
            r=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] | .status + " " + .conclusion' 2>/dev/null || true)
            case "$r" in
              "completed success") echo "The tests of $sha passed."; exit 0;;
              completed*) echo "The tests of $sha did not pass ($r): nothing is published."; exit 1;;
            esac
            echo "Waiting for the tests of $sha (${r:-not started})"
            sleep 20
          done
          echo "The tests of $sha did not finish within 40 minutes."
          exit 1
      - name: Publish
        shell: bash
        # GitHub can answer with a passing server error (it did once, during an outage): try three times
        run: |
          for deneme in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" dist/PageSiren-Setup.exe dist/PageSiren-Setup.exe.sha256 --clobber && exit 0
            else
              gh release create "$TAG" dist/PageSiren-Setup.exe dist/PageSiren-Setup.exe.sha256 --title "PageSiren ${TAG#v}" --notes-from-tag && exit 0
            fi
            echo "GitHub did not take it (try $deneme), trying again in 30 s"
            sleep 30
          done
          exit 1
